{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<h1>Iniciar Sesión</h1>
<form method="post">

    <label>Contraseña: <input type="password" name="password" required></label><br><br>
    <button type="submit">Entrar</button>
</form>
{% endblock %}
